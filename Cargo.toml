[workspace]
members = [
    "crates/openleash-core",
    "crates/openleash-api",
    "crates/openleash-db",
    "crates/openleash-backend",
    "crates/openleash-backend-pip",
    "crates/openleash-backend-brew",
    "crates/openleash-backend-npm",
    "crates/openleash-backend-keychain",
    "crates/openleash-backend-telegram",
    "crates/openleash-venv",
    "crates/openleash-client",
    "crates/openleashd",
    "crates/openleash",
]
resolver = "2"

[workspace.dependencies]
# Core Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# gRPC and Protocol Buffers
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Database (SQLite)
sqlx = { version = "0.7", features = [ "runtime-tokio", "sqlite", "chrono", "uuid" ] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Command Line Interface
clap = { version = "4.4", features = ["derive", "env"] }

# Cryptography & Tokens (JWT)
jsonwebtoken = "9"
ring = "0.17"

# IDs and Timestamps
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging and Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Telegram Bot
teloxide = { version = "0.12", features = ["macros"] }

# macOS Security Framework
security-framework = "2.9"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"
tempfile = "3.8"

# Local Crates
openleash-core = { path = "crates/openleash-core" }
openleash-api = { path = "crates/openleash-api" }
openleash-db = { path = "crates/openleash-db" }
openleash-backend = { path = "crates/openleash-backend" }
openleash-backend-pip = { path = "crates/openleash-backend-pip" }
openleash-backend-brew = { path = "crates/openleash-backend-brew" }
openleash-backend-npm = { path = "crates/openleash-backend-npm" }
openleash-backend-keychain = { path = "crates/openleash-backend-keychain" }
openleash-backend-telegram = { path = "crates/openleash-backend-telegram" }
openleash-venv = { path = "crates/openleash-venv" }
openleash-client = { path = "crates/openleash-client" }
openleashd = { path = "crates/openleashd" }
openleash = { path = "crates/openleash" }
