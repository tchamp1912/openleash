[workspace]
members = [
    "crates/leash-ai-core",
    "crates/leash-ai-api",
    "crates/leash-ai-db",
    "crates/leash-ai-backend",
    "crates/leash-ai-backend-pip",
    "crates/leash-ai-backend-brew",
    "crates/leash-ai-backend-npm",
    "crates/leash-ai-backend-keychain",
    "crates/leash-ai-backend-telegram",
    "crates/leash-ai-venv",
    "crates/leash-ai-client",
    "crates/leashd",
    "crates/leash",
]
resolver = "2"

[workspace.dependencies]
# Core Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# gRPC and Protocol Buffers
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Database (SQLite)
sqlx = { version = "0.7", features = [ "runtime-tokio", "sqlite", "chrono", "uuid" ] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Command Line Interface
clap = { version = "4.4", features = ["derive", "env"] }

# Cryptography & Tokens (JWT)
jsonwebtoken = "9"
ring = "0.17"

# IDs and Timestamps
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging and Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Telegram Bot
teloxide = { version = "0.12", features = ["macros"] }

# macOS Security Framework
security-framework = "2.9"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"
tempfile = "3.8"

# Local Crates
leash-ai-core = { path = "crates/leash-ai-core" }
leash-ai-api = { path = "crates/leash-ai-api" }
leash-ai-db = { path = "crates/leash-ai-db" }
leash-ai-backend = { path = "crates/leash-ai-backend" }
leash-ai-backend-pip = { path = "crates/leash-ai-backend-pip" }
leash-ai-backend-brew = { path = "crates/leash-ai-backend-brew" }
leash-ai-backend-npm = { path = "crates/leash-ai-backend-npm" }
leash-ai-backend-keychain = { path = "crates/leash-ai-backend-keychain" }
leash-ai-backend-telegram = { path = "crates/leash-ai-backend-telegram" }
leash-ai-venv = { path = "crates/leash-ai-venv" }
leash-ai-client = { path = "crates/leash-ai-client" }
leashd = { path = "crates/leashd" }
leash = { path = "crates/leash" }
